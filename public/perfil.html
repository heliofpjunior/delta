<html class="light" lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Perfil - Delta Estrategista</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#258cf4",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                        "navy-sidebar": "#0d141c",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex overflow-x-hidden">
    <aside
        class="w-64 bg-navy-sidebar text-slate-300 flex flex-col fixed h-full z-50 sidebar-transition sidebar-mobile-hidden lg:translate-x-0">
        <div class="p-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="size-10 bg-primary rounded-lg flex items-center justify-center text-white">
                    <span class="material-symbols-outlined">verified_user</span>
                </div>
                <div>
                    <h1 class="text-white text-base font-bold leading-none">Delta Estrategista</h1>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <nav class="flex-1 px-4 py-4 space-y-1">
            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 transition-colors"
                href="index.html">
                <span class="material-symbols-outlined text-[22px]">dashboard</span>
                <span class="text-sm font-medium">Painel</span>
            </a>
            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 transition-colors"
                href="certificados.html">
                <span class="material-symbols-outlined text-[22px]">description</span>
                <span class="text-sm font-medium">Certificados</span>
            </a>
            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 transition-colors"
                href="clientes.html">
                <span class="material-symbols-outlined text-[22px]">group</span>
                <span class="text-sm font-medium">Clientes</span>
            </a>
            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 transition-colors"
                href="relatorios.html">
                <span class="material-symbols-outlined text-[22px]">bar_chart</span>
                <span class="text-sm font-medium">Relatórios</span>
            </a>
            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 transition-colors"
                href="configuracoes.html">
                <span class="material-symbols-outlined text-[22px]">settings</span>
                <span class="text-sm font-medium">Configurações</span>
            </a>
        </nav>
    </aside>
    <main class="flex-1 lg:ml-64 min-h-screen flex flex-col w-full">
        <header
            class="sticky top-0 z-40 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-4">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()"
                    class="lg:hidden p-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h2 class="text-xl font-bold">Meu Perfil</h2>
            </div>
        </header>
        <div class="p-8">
            <div class="max-w-4xl">
                <h2 class="text-2xl font-bold mb-6">Meu Perfil</h2>
                <div
                    class="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col md:flex-row items-center gap-6">
                    <div class="size-24 rounded-full bg-slate-200 bg-cover bg-center border-4 border-primary/20 flex-shrink-0"
                        style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAA65jbQbRFT_PDlvYMVTP3jdi6Y0M5XKach0uVKCc-u2nNiGY4dXathU9JL2D1fYBSRDJi1KuMjH_m4OZJTcO-vfJ3w0gVvuveIyKE23dzwugAuCd7laQ0bZE2IrG5aFxSPVmApOaPv2qJGIw4iLTESk8t2EBUYQJBTjzFFqpxVPxizXpfvDG_E8MSjXrNJCg4v3hJiYh3thS6oAAbbg3lP9pJL9tg8WUQXGUnMB8Z9CS_Dx6TE6QSzjjnWEoYy5CQSiCjDAc63_M')">
                    </div>
                    <div class="text-center md:text-left">
                        <h3 class="text-xl font-bold">Usuário Delta</h3>
                        <p class="text-slate-500">Administrador / Estrategista</p>
                        <div class="flex flex-col sm:flex-row gap-2 mt-4">
                            <button
                                class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold w-full sm:w-auto">Editar
                                Perfil</button>
                            <button
                                class="bg-slate-100 dark:bg-slate-700 px-4 py-2 rounded-lg text-sm font-bold w-full sm:w-auto">Alterar
                                Senha</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/scripts.js"></script>
</body>

</html>
